name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/face-tracking-priority, fix/mediapipe-vtuber-theme, fix/face-pose-matrix]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run face tracking unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxGirlSupremacy-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
