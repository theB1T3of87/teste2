name: Android Debug APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Validate Cubism native libraries
        run: |
          test -f CubismSdkForNative-5-r.5/Core/lib/android/arm64-v8a/libLive2DCubismCore.a
          test -f CubismSdkForNative-5-r.5/Core/lib/android/x86_64/libLive2DCubismCore.a
          test -f CubismSdkForNative-5-r.5/Samples/OpenGL/thirdParty/stb/stb_image.h

      - name: Build debug APK
        run: bash ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxGirlSupremacy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
